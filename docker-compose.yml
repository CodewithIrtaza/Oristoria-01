services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: oristoria
      POSTGRES_USER: oristoria
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
