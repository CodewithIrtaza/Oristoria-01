# Dependabot — weekly dependency update PRs (repo hygiene).
# Manifest locations follow docs/TECH_DESIGN.md §7.1:
#   Python backend  -> apps/api/requirements.txt
#   JS frontend     -> apps/web/package.json
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
