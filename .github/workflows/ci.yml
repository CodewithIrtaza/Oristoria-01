name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement apps/api/requirements.txt
      - name: Run fast tests
        run: python -m pytest -m "not live"
      - name: Run linter
        run: python scripts/lint.py
